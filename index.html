<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>coke momo</title>
  <meta name="description" content="Visual stories and photography by coke momo.">
  <link rel="canonical" href="https://www.cokemomo.com/">

  <link rel="icon" href="/favicon.png" sizes="512x512" type="image/png">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#ffffff">

  <style>
    :root{
      --bg:#ffffff;
      --page-max: 1400px;
      --page-pad: 32px;
      --header-height: 100px; 
      --header-border-width: 1px;
      --header-border-color: rgba(0,0,0,.06);
      --logo-width: 200px;
      --gap: 32px;
      --radius: 16px;
      --border: 0px solid rgba(0,0,0,0.30);
      --shadow: 0 18px 40px rgba(0,0,0,.40);
      --ui-font-size: 13px;
      --ui-opacity: .75;
      --footer-font-size: 12px;
      --footer-opacity: .5;
      --footer-padding: 48px 0 24px;
      --tile-aspect: 4 / 5;
      --wide-aspect: 16 / 9;
    }

    *{ box-sizing:border-box; }
    
    html,body{ 
        margin:0; padding:0; background:var(--bg); color:#111; 
        -webkit-user-select: none; user-select: none;
        overflow-x: hidden; 
        cursor: default;
    }
    img { -webkit-user-drag: none; user-drag: none; pointer-events: none; }

    body{
      font-family:-apple-system,BlinkMacSystemFont, "Helvetica Neue",Helvetica,Arial,sans-serif;
    }

    /* ===== HEADER FIJO ===== */
    header{
      position: fixed; 
      top: 0; left: 0; width: 100%; height: var(--header-height);
      z-index: 5000;
      background: rgba(255,255,255,.98);
      backdrop-filter: blur(8px);
      border-bottom: var(--header-border-width) solid var(--header-border-color);
      display: flex; align-items: center;
    }

    .header-inner{
      width: 100%; max-width: var(--page-max); margin: 0 auto; padding: 0 var(--page-pad);
      display:flex; align-items:center; justify-content:space-between; height: 100%;
    }

    .logo{
      width: var(--logo-width); max-width:60vw; cursor:pointer; user-select:none; pointer-events: auto; 
    }

    .menu{ position: relative; font-size: var(--ui-font-size); opacity: var(--ui-opacity); }
    .menu button{ background:none; border:none; font:inherit; cursor:pointer; padding:6px 10px; }

    .menu-list{
      position:absolute; right:0; top:100%; margin-top:10px;
      background:#fff; border:1px solid rgba(0,0,0,.08);
      border-radius:10px; box-shadow:0 12px 30px rgba(0,0,0,.08);
      display:none; min-width:160px; overflow:hidden;
    }
    .menu.open .menu-list{ display:block; }

    .menu-list button{
      width:100%; text-align:left; padding:10px 14px; border:none;
      background:none; cursor:pointer; font-size:13px;
    }
    .menu-list button:hover{ background: rgba(0,0,0,.04); }

    main{
      max-width: var(--page-max); margin: 0 auto; padding: var(--page-pad);
      margin-top: var(--header-height); 
      min-height: calc(100vh - var(--header-height));
    }

    section{ display:none; }
    section.active{ display:block; }

    .story-header{ margin-bottom: 32px; }
    .story-title-row{ display:flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
    .story-title{ font-size: 18px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; user-select:none; }
    .story-subtitle{ font-size: 15px; font-weight: 400; font-style: italic; opacity: .78; user-select:none; white-space: nowrap; }

    /* ===== PORTADA ===== */
    .home-hero{
      width: 100vw; position: relative; left: 50%; right: 50%;
      margin-left: -50vw; margin-right: -50vw;
      display:block; object-fit: cover; box-shadow: var(--shadow);
      margin-top: -32px; 
    }

    .grid{ display:grid; grid-template-columns: repeat(2,1fr); gap: var(--gap); }
    @media (max-width: 900px){ .grid{ grid-template-columns:1fr; } }

    .tile{
      position: relative; overflow:hidden; border-radius: var(--radius);
      border: var(--border); box-shadow: var(--shadow); 
      cursor: none; 
      background:#fff; aspect-ratio: var(--tile-aspect); pointer-events: auto;
    }
    .tile.wide{ grid-column: span 2; aspect-ratio: var(--wide-aspect); }

    .tile img{
      position:absolute; inset:0; width:100%; height:100%;
      object-fit: cover; display:block; user-select:none;
    }

    footer{
      max-width: var(--page-max); margin: 0 auto; padding: var(--footer-padding);
      text-align:center; font-size: var(--footer-font-size); opacity: var(--footer-opacity); user-select:none;
    }

    /* ===== LIGHTBOX (ESCRITORIO) ===== */
    .lightbox{
      position: fixed; top: var(--header-height); left: 0; width: 100%;
      height: calc(100vh - var(--header-height)); 
      display:none; z-index: 4000; background: #ffffff;
      align-items: center; justify-content: center;
      touch-action: none; overflow: hidden;
      cursor: none; 
    }

    .lightbox.open{ display:flex; }

    .lb-ui{ position: absolute; inset:0; pointer-events:none; z-index:4100; }
    .lightbox.direct-zoom .lb-btn { display: none; }
    .lightbox.direct-zoom .caption { display: none; }

    .lightbox-inner{ width: 100%; height: 100%; position: relative; overflow: hidden; }
    .lb-stage{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; }

    .lightbox-img{
      max-width:100%; max-height:100%; object-fit: contain;
      transform-origin: center center; 
      /* IMPORTANTE: Quitamos "will-change" para que la calidad sea máxima al hacer zoom */
      /* will-change: transform;  <-- ELIMINADO */
      pointer-events: none; transition: none; 
    }
    
    .lb-protection {
      position: absolute; inset: 0; z-index: 4050; 
      cursor: none; 
    }

    .caption{
      position: absolute; bottom: 20px; left:0; width:100%;
      font-size:13px; opacity:.8; text-align:center;
      pointer-events: none; z-index: 4200;
      background: rgba(255,255,255,0.8); padding: 5px 0;
    }

    /* ===== MENSAJE EN EL CURSOR ===== */
    .cursor-msg {
        position: fixed;
        top: 0; left: 0;
        pointer-events: none;
        z-index: 6000;
        padding: 6px 10px;
        background: rgba(0, 0, 0, 0.85);
        color: white;
        font-size: 10px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        border-radius: 4px;
        opacity: 0;
        transform: translate(15px, 15px);
        transition: opacity 0.2s ease, transform 0.1s ease;
        white-space: nowrap;
    }
    
    .cursor-msg.visible { opacity: 1; }

    @media (max-width: 600px){
      :root{ --page-pad:18px; --logo-width:160px; --gap:22px; --wide-aspect: 4 / 3; --header-height: 80px; }
      .tile.wide{ grid-column: span 1; }
      .cursor-msg { display: none; }
      .home-hero { margin-top: -18px; } 
    }

    /* =========================================
       CONFIGURACIÓN MÓVIL (ZOOM 300% + SCROLL)
       ========================================= */
    @media (max-width: 900px) {
        .lightbox { display: none; } 
        
        .lightbox.open {
            display: block; 
            overflow: auto; 
            -webkit-overflow-scrolling: touch;
            touch-action: auto;
            padding: 0;
        }

        .lightbox-inner {
            height: auto;
            min-height: 100%;
            overflow: visible;
            display: flex; 
            align-items: flex-start;
            justify-content: flex-start;
        }
        
        .lb-stage {
            display: block;
            width: auto;
            height: auto;
            padding: 0;
        }

        .lightbox-img {
            /* MÓVIL: Forzamos ancho 300% de la pantalla */
            width: 300vw !important; 
            max-width: none !important;
            height: auto !important;
            max-height: none !important;
            
            transform: none !important;
            margin: 0;
            display: block;
            
            pointer-events: auto; 
            cursor: zoom-out;
        }

        .lb-protection { display: none !important; }
        .caption { display: none !important; }
        .lb-btn { display: none !important; }
    }
  </style>
</head>

<body oncontextmenu="return false;">

<div class="cursor-msg" id="cursorMsg">CLICK TO ZOOM</div>

<header>
  <div class="header-inner">
    <img src="assets/img/logo.png" class="logo" id="logoHome">
    <div class="menu" id="menu">
      <button id="menuToggle">STORIES</button>
      <div class="menu-list">
        <button data-target="home">HOME</button>
        <button data-target="psilicon-flesh">PSILICON FLESH</button>
        <button data-target="held-in-time">HELD IN TIME</button>
        <button data-target="path">PATH</button>
        <button data-target="strings">STRINGS</button>
        <button data-target="portraiture">PORTRAITURE</button>
        <button data-target="core">CORE</button>
      </div>
    </div>
  </div>
</header>

<main>
  <section id="home" class="active">
    <img src="assets/img/photos/MAIN.jpg" class="home-hero" alt="coke momo">
  </section>

  <section id="psilicon-flesh">
    <div class="story-header"><div class="story-title-row"><div class="story-title"></div><div class="story-subtitle"></div></div></div>
    <div class="grid"></div>
  </section>
  <section id="held-in-time">
    <div class="story-header"><div class="story-title-row"><div class="story-title"></div><div class="story-subtitle"></div></div></div>
    <div class="grid"></div>
  </section>
  <section id="path">
    <div class="story-header"><div class="story-title-row"><div class="story-title"></div><div class="story-subtitle"></div></div></div>
    <div class="grid"></div>
  </section>
  <section id="strings">
    <div class="story-header"><div class="story-title-row"><div class="story-title"></div><div class="story-subtitle"></div></div></div>
    <div class="grid"></div>
  </section>
  <section id="portraiture">
    <div class="story-header"><div class="story-title-row"><div class="story-title"></div><div class="story-subtitle"></div></div></div>
    <div class="grid"></div>
  </section>
  <section id="core">
    <div class="story-header"><div class="story-title-row"><div class="story-title"></div><div class="story-subtitle"></div></div></div>
    <div class="grid"></div>
  </section>
</main>

<footer>© coke momo · 2026</footer>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <div class="lb-ui">
    <button class="lb-btn lb-close" id="lbClose">×</button>
    <button class="lb-btn lb-prev" id="lbPrev">‹</button>
    <button class="lb-btn lb-next" id="lbNext">›</button>
  </div>
  <div class="lightbox-inner">
    <div class="lb-stage">
      <div class="lb-protection" id="lbProtection"></div>
      <img class="lightbox-img" id="lbImg" alt="">
    </div>
    <div class="caption" id="lbCaption"></div>
  </div>
</div>

<script>
  const MAX_PHOTOS = 40;
  const EXT = '.jpg';
  const WIDE_RATIO = 1.1;
  const ZOOM_SCALE_DESKTOP = 2; // Zoom nítido en Desktop
  
  const getHeaderHeight = () => parseInt(getComputedStyle(document.documentElement).getPropertyValue('--header-height'));

  let captions = {};
  let currentList = [];
  let currentIndex = -1;

  const lightbox = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  const lbProtection = document.getElementById('lbProtection');
  const lbCaption = document.getElementById('lbCaption');
  const cursorMsg = document.getElementById('cursorMsg');

  // ACTUALIZADO: Descripciones con claves nuevas
  const STORY_DESCRIPTIONS = {
    "psilicon-flesh": "Band Press Photos.",
    "held-in-time": "The process of the unique.",
    "path": "Images from the path itself.",
    "strings": "People around.",
    "portraiture": "Studio lighting.",
    "core": "What moves us."
  };

  document.addEventListener('mousemove', (e) => {
    cursorMsg.style.left = e.clientX + 'px';
    cursorMsg.style.top = e.clientY + 'px';
  });

  function showCursorMsg(text) {
    if (window.innerWidth > 900) { 
        cursorMsg.textContent = text;
        cursorMsg.classList.add('visible');
    }
  }
  function hideCursorMsg() {
    cursorMsg.classList.remove('visible');
  }

  lbProtection.addEventListener('mouseenter', () => showCursorMsg('CLICK TO ZOOM OUT'));
  lbProtection.addEventListener('mouseleave', hideCursorMsg);


  function setActiveSection(id){
    document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
  function goHome(){ setActiveSection('home'); }

  async function loadStory(storyId){
    const section = document.getElementById(storyId);
    const grid = section.querySelector('.grid');
    const titleEl = section.querySelector('.story-title');
    const subtitleEl = section.querySelector('.story-subtitle');
    const btn = document.querySelector(`.menu-list button[data-target="${storyId}"]`);
    
    titleEl.textContent = btn ? btn.textContent : '';
    const desc = STORY_DESCRIPTIONS[storyId] || "Ten small moments.";
    subtitleEl.textContent = " / " + desc;

    grid.innerHTML = '';
    captions = {};
    currentList = [];
    
    // RUTA ACTUALIZADA
    const base = `assets/img/stories/${storyId}/`;

    try{
      const r = await fetch(base + 'captions.json', { cache:'no-store' });
      if (r.ok) captions = await r.json();
    }catch(e){}

    for(let i=1;i<=MAX_PHOTOS;i++){
      const name = `PHOTO-${i}${EXT}`;
      const src = base + name;
      const tile = document.createElement('div');
      tile.className = 'tile';
      const img = document.createElement('img');
      img.src = src; img.loading = 'lazy'; img.alt = '';
      
      tile.addEventListener('mouseenter', () => showCursorMsg('CLICK TO ZOOM'));
      tile.addEventListener('mouseleave', hideCursorMsg);

      img.addEventListener('load', () => {
        if (img.naturalWidth / img.naturalHeight > WIDE_RATIO) tile.classList.add('wide');
        currentList.push({ src, name, caption: captions[name] || '' });
      });
      img.addEventListener('error', () => tile.remove());
      
      tile.addEventListener('click', () => {
        const idx = currentList.findIndex(x => x.name === name);
        hideCursorMsg();
        openLightbox(idx >= 0 ? idx : 0);
      });
      tile.appendChild(img);
      grid.appendChild(tile);
    }
  }

  function openLightbox(index){
    if (!currentList.length) return;
    currentIndex = (index + currentList.length) % currentList.length;
    const item = currentList[currentIndex];
    lbImg.src = item.src;
    lbCaption.textContent = item.caption || '';
    
    lightbox.classList.add('open', 'direct-zoom');
    lightbox.setAttribute('aria-hidden','false');
    document.body.style.overflow = 'hidden';

    // LÓGICA MÓVIL vs ESCRITORIO
    if (window.innerWidth > 900) {
      const hOffset = getHeaderHeight();
      requestAnimationFrame(() => updatePan(window.innerWidth / 2, (window.innerHeight - hOffset) / 2));
    } else {
      setTimeout(() => {
         lightbox.scrollLeft = (lightbox.scrollWidth - window.innerWidth) / 2;
         lightbox.scrollTop = (lightbox.scrollHeight - window.innerHeight) / 2;
      }, 10);
    }
  }

  function closeLightbox(){
    lightbox.classList.remove('open', 'direct-zoom');
    lightbox.setAttribute('aria-hidden','true');
    lbImg.src = '';
    document.body.style.overflow = '';
    hideCursorMsg();
  }

  function updatePan(mouseX, mouseY){
    if (window.innerWidth <= 900) return;

    if (!lbImg.naturalWidth) return;

    const hOffset = getHeaderHeight();
    const viewportW = window.innerWidth;
    const viewportH = window.innerHeight - hOffset;

    const imgRatio = lbImg.naturalWidth / lbImg.naturalHeight;
    const screenRatio = viewportW / viewportH;

    let renderW, renderH;

    if (imgRatio > screenRatio) {
      renderW = viewportW; renderH = viewportW / imgRatio;
    } else {
      renderH = viewportH; renderW = viewportH * imgRatio;
    }

    const scaledW = renderW * ZOOM_SCALE_DESKTOP;
    const scaledH = renderH * ZOOM_SCALE_DESKTOP;

    const overflowX = Math.max(0, scaledW - viewportW);
    const overflowY = Math.max(0, scaledH - viewportH);

    const xPerc = mouseX / viewportW;
    const yPerc = Math.max(0, Math.min(1, (mouseY - hOffset) / viewportH));

    const moveX = (0.5 - xPerc) * overflowX;
    const moveY = (0.5 - yPerc) * overflowY;

    lbImg.style.transform = `translate(${moveX}px, ${moveY}px) scale(${ZOOM_SCALE_DESKTOP})`;
  }

  lbProtection.addEventListener('mousemove', (e) => {
    requestAnimationFrame(() => { updatePan(e.clientX, e.clientY); });
  });

  lbProtection.addEventListener('click', closeLightbox);
  lbImg.addEventListener('click', closeLightbox); 
  
  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });

  const menu = document.getElementById('menu');
  document.getElementById('menuToggle').addEventListener('click', () => { menu.classList.toggle('open'); });
  document.addEventListener('click', (e) => { if (!menu.contains(e.target)) menu.classList.remove('open'); });
  
  document.querySelectorAll('.menu-list button').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.target;
      menu.classList.remove('open');
      setActiveSection(id);
      if (id !== 'home') await loadStory(id); else goHome();
    });
  });

  document.getElementById('logoHome').addEventListener('click', goHome);
</script>

</body>
</html>
